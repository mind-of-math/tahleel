<script>
const NS=20,NC=5,NR=25;const defFM=p=>p==3?40:20,docFM=(d,p=st.p)=>+d.fm>0?+d.fm:defFM(p),bands=fm=>[.9,.8,.75,.7,.5,0].map(x=>Math.round(x*fm*100)/100);

 m:{n:"المرحلة المتوسطة",l:"للمرحلة المتوسطة",b:"متوسط",pre:"m_",gr:["أول متوسط","ثاني متوسط","ثالث متوسط"]},s:{n:"المرحلة الثانوية",l:"للمرحلة الثانوية",b:"ثانوي",pre:"",gr:["أول ثانوي","ثاني ثانوي","ثالث ثانوي"]}};
const SK0=["e1","e2","m","s"];
const TN=["","الأول","الثاني"];
const $=s=>document.querySelector(s);
let stg0="s",picked=false;try{const v=localStorage.getItem("ra_stage");if(SG[v]){stg0=v;picked=true;}}catch(e){}
const st={s:stg0,y:"1448",g:1,k:"",t:1,p:1,v:"sum"},PN=["","الفترة الأولى","الفترة الثانية","الاختبار النهائي"];
const TRK={s:{2:1,3:1},e1:{1:1,2:1,3:1}},TRL={s:[{c:"",n:"علمي",i:"🔬"},{c:"b",n:"إداري",i:"💼"}],e1:[{c:"",n:"عام",i:"📘"},{c:"n",n:"احتياجات خاصة",i:"💜"}]};

const trName=g=>{const L=TR(g);if(!L)return"";const x=L.find(y=>y.c===trk(g))||L[0];return x.n;};
const GN=new Proxy([],{get:(o,k)=>{const n=+k;return n>=1&&n<=3?SG[st.s].gr[n-1]+(TR(n)?" — "+trName(n):""):o[k];}});
const PF=()=>SG[st.s].pre;
let docs={},db=null,dl=null,timers={},tt;
const kk=(g,t,p,i)=>p==3?`${PF()}${st.y}_g${g}${trk(g)}_t${t}_s${i}`:`${PF()}${st.y}_g${g}${trk(g)}_t${t}_p${p}_s${i}`;
const rKey=()=>`roster_${st.s}`;
function roster(){try{return JSON.parse(docs[rKey()].list)||[];}catch(e){return[];}}
const nrm=s=>String(s||"").trim().replace(/^ال/,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ");
function autoTeacher(subj,g){const k=nrm(subj);if(!k)return"";const m=roster().filter(r=>r.n&&nrm(r.s)===k&&(r.g||[]).includes(g));return m.length===1?m[0].n:"";}
const key=(i,p=st.p)=>kk(st.g,st.t,p,i);
const MATH="الرياضيات";const pinMath=()=>!(st.s==="s"&&trk(st.g)==="b");const PIN=i=>i==1&&pinMath();function getDoc(i){const d=getDoc0(i);return PIN(i)&&d.name!==MATH?{...d,name:MATH}:d;}
function getDoc0(i){const d=docs[key(i)];if(d&&d.name)return d;for(const q of [1,2,3]){const o=docs[key(i,q)];if(o&&o.name)return {...(d||blank()),name:o.name,teacher:(d&&d.teacher)||o.teacher};}return d||blank();}
const blank=()=>({name:"",teacher:"",total:0,avg:"",sc:JSON.stringify(Array.from({length:NC},()=>Array(NR).fill("")))});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nz=s=>String(s).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٫,]/g,".").trim();
const chk=(s,fm)=>{s=nz(s);if(s==="")return"";const n=Number(s);if(!isFinite(n))return"القيمة غير رقمية، أدخلي رقمًا فقط";if(n<0)return"الدرجة لا يمكن أن تكون سالبة";if(n>fm)return`الدرجة ${n} أكبر من الدرجة الكاملة (${fm})`;return"";};
const f2=x=>x===""?"":(+x).toFixed(2),pc=x=>x===""?"":(x*100).toFixed(2)+"%";
function calc(d,p=st.p){const fm=docFM(d,p),LO=bands(fm);const v=[];let bad=0;JSON.parse(d.sc).slice(0,NC).forEach(c=>c.slice(0,d._m?1e4:NR).forEach(x=>{if(nz(x)==="")return;if(chk(x,fm))bad++;else v.push(Number(nz(x)));}));
 const t=+d.total||0,n=v.length,r={n,bad,t,fm};r.full=v.filter(x=>x===fm).length;r.max=n?Math.max(...v):"";r.min=n?Math.min(...v):"";
 r.cnt=LO.map((lo,k)=>v.filter(x=>x>=lo&&(k?x<LO[k-1]:true)).length);r.pct=r.cnt.map(c=>n?c/n:"");
 const m=n?v.reduce((a,b)=>a+b,0)/n:"";r.mean=m;r.mp=n?m/fm:"";r.sd=n>1?Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(n-1)):"";
 r.weak=n?(r.cnt[3]+r.cnt[4]+r.cnt[5])/n:"";
 r.msg=!n&&!bad?"":bad?`⚠ توجد ${bad} قيمة غير صحيحة (أكبر من ${fm} أو سالبة أو غير رقمية) — مظللة بالأحمر`:!t?"⚠ أدخلي عدد الطالبات الكلي":n>t?`⚠ عدد الدرجات المدخلة (${n}) أكبر من عدد الطالبات (${t})`:"✓ البيانات سليمة";
 return r;}
const rows=fm=>[["عدد الطالبات المختبرات (حسب الدرجات المدخلة)",r=>r.n],["عدد الطالبات غير المختبرات",r=>r.t?Math.max(r.t-r.n,0):""],[`عدد الحاصلات على الدرجة الكاملة${fm?` (${fm})`:""}`,r=>r.full],["أعلى درجة في الاختبار",r=>f2(r.max)],["أدنى درجة في الاختبار",r=>f2(r.min)],
 ...BN.map((n,k)=>[`نسبة الحاصلات على ${n}`,r=>pc(r.pct[k])]),["الانحراف المعياري لدرجات الاختبار",r=>f2(r.sd),1],["نسبة الضعف النوعي (جيد + مقبول + ضعيف)",r=>pc(r.weak),1],
 [`متوسط درجات الاختبار${fm?` من ${fm}`:""}`,r=>f2(r.mean),1],[`النسبة المئوية للمتوسط${fm?` من ${fm}`:" من الدرجة الكاملة"}`,r=>pc(r.mp),1]];
const secKey=g=>`${PF()}${st.y}_g${g}${trk(g)}_secs`;
const secName=(g,c)=>{try{return JSON.parse(docs[secKey(g)].sn)[c]||"فصل "+(c+1);}catch(e){return"فصل "+(c+1);}};
function secStats(d,p=st.p){const fm=docFM(d,p),LO=bands(fm);return JSON.parse(d.sc).slice(0,NC).map(col=>{const v=[];col.slice(0,d._m?1e4:NR).forEach(x=>{if(nz(x)!==""&&!chk(x,fm))v.push(Number(nz(x)));});
 const n=v.length,m=n?v.reduce((a,b)=>a+b,0)/n:"",cnt=LO.map((lo,k)=>v.filter(x=>x>=lo&&(k?x<LO[k-1]:true)).length);
 return{n,mean:m,mp:n?m/fm:"",ex:n?cnt[0]/n:"",weak:n?(cnt[3]+cnt[4]+cnt[5])/n:"",max:n?Math.max(...v):"",min:n?Math.min(...v):""};});}
